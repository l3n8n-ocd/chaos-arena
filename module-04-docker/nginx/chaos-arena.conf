# =============================================================================
# Chaos Arena — HOST Nginx site config (Module 04)
# __DOMAIN__ is replaced automatically by scripts/03-switch-nginx.sh
# Installed to: /etc/nginx/sites-available/chaos-arena
#
#   Browser --HTTPS--> host Nginx --HTTP--> [web container 127.0.0.1:8080] --> [app container]
#                      (TLS, rate limit)     (page + /api/ proxy)
#
# The host Nginx keeps the jobs that belong to the server itself: the HTTPS
# certificate (renewed by certbot), HTTP->HTTPS redirect, and the request quota.
# Everything about the app lives in the containers.
# =============================================================================

upstream chaos_arena_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # HTTPS-only header belongs to the TLS layer; the other security headers
    # come from the web container.
    add_header Strict-Transport-Security "max-age=86400" always;

    access_log /var/log/nginx/chaos-arena.access.log;
    error_log  /var/log/nginx/chaos-arena.error.log;

    # Is the HOST web server alive?
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Game API -> web container -> app container
    location /api/ {
        limit_req zone=arena_api burst=200 nodelay;   # quota: 100 req/s per IP
        proxy_pass http://chaos_arena_web;
        include /etc/nginx/snippets/chaos-arena-proxy.conf;
        error_page 502 504 = @app_down;
    }

    # Web page -> web container
    location / {
        proxy_pass http://chaos_arena_web;
        include /etc/nginx/snippets/chaos-arena-proxy.conf;
        # If the WHOLE web container is down, serve a copy of the page from disk.
        error_page 502 504 = @static_fallback;
    }

    location @app_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        return 503 '{"error":"app_down","message":"The game containers are restarting (self-healing in progress)."}';
    }

    location @static_fallback {
        root /srv/chaos-arena/app/public;
        try_files $uri /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
}
