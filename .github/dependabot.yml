# Dependabot opens pull requests when dependencies have updates or security fixes.
# Each PR runs through the CI pipeline before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
