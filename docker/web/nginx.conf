# =============================================================================
# Nginx config INSIDE the "web" container (Module 04)
#
#   browser -> [web container :8080] --+--> static files (/usr/share/nginx/html)
#                                      +--> /api/  -->  [app container :3000]
# =============================================================================

# 127.0.0.11 is Docker's built-in DNS server. It turns the service name "app"
# into the app container's current IP address. "valid=10s" makes Nginx look the
# name up again, so it keeps working after the app container is replaced.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers live here, next to the page they protect, so they are
    # the same on the server and when running locally with Docker Compose.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Is this container alive? (used by its Docker HEALTHCHECK)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Using a variable makes Nginx resolve "app" at request time (see resolver).
        set $app_upstream http://app:3000;
        proxy_pass $app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # App container down or restarting? Answer with clean JSON.
        error_page 502 504 = @app_down;
    }

    location @app_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"app_down","message":"The game container is restarting (self-healing in progress)."}';
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
