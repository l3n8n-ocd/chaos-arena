# =============================================================================
# Chaos Arena — Nginx site config (Module 03)
# __DOMAIN__ is replaced automatically by scripts/03-configure-nginx.sh
# Installed to: /etc/nginx/sites-available/chaos-arena
#
#   Browser --HTTPS--> Nginx --+--> static files  /srv/chaos-arena/app/public
#                              +--> /api/*  ----> Node.js on 127.0.0.1:3000
#
# Nginx serves the web page itself, so the page still loads while the game
# server is down. Only the /api/ calls fail, and the page shows "healing...".
# =============================================================================

upstream chaos_arena_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root  /srv/chaos-arena/app/public;
    index index.html;

    # Security headers (sent on every response)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    # Only load scripts, styles and data from this site itself.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    access_log /var/log/nginx/chaos-arena.access.log;
    error_log  /var/log/nginx/chaos-arena.error.log;

    # Is the WEB SERVER alive? (answered by Nginx itself)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The game API: forwarded to the Node.js app.
    location /api/ {
        # Quota: max 100 requests/second per IP address (see conf.d/chaos-arena-limits.conf)
        limit_req zone=arena_api burst=200 nodelay;

        proxy_pass http://chaos_arena_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # App not answering (crashed / restarting)? Reply with clean JSON.
        error_page 502 504 = @app_down;
    }

    location @app_down {
        default_type application/json;
        return 503 '{"error":"app_down","message":"The game server is restarting (self-healing in progress)."}';
    }

    # The web page (HTML, CSS, JS): always check for a newer version.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
