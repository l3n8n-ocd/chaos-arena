# =============================================================================
# Chaos Arena — Nginx site config (Module 02)
# __DOMAIN__ is replaced automatically by scripts/04-install-nginx.sh
# Installed to: /etc/nginx/sites-available/chaos-arena
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root  /srv/chaos-arena/site;
    index index.html;

    server_tokens off;   # don't reveal the Nginx version to visitors/attackers

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/chaos-arena.access.log;
    error_log  /var/log/nginx/chaos-arena.error.log;

    # Health check endpoint: returns "ok" if the server is alive.
    # Monitoring (Module 05) will poll this URL.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
